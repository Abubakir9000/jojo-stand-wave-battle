<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoJo Stand Wave Survival</title>
  <style>
    :root {
      --bg: #050811;
      --panel: rgba(14, 20, 34, 0.96);
      --panel2: rgba(19, 26, 40, 0.96);
      --gold: #f7d77e;
      --gold2: #e4b95d;
      --pink: #ff67d7;
      --green: #68f5a7;
      --cyan: #7fdcff;
      --red: #ff5d5d;
      --violet: #b28dff;
      --text: #eef3ff;
      --muted: #a9b6d1;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at top, #0a0f19 0%, #04070d 58%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .app {
      display: flex;
      gap: 18px;
      width: 100%;
      max-width: 1500px;
      height: calc(100vh - 28px);
    }

    .game-shell {
      position: relative;
      flex: 1;
      min-width: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(11, 18, 30, 0.95), rgba(9, 16, 28, 0.95));
      border: 2px solid rgba(247, 215, 126, 0.85);
      box-shadow: 0 0 26px rgba(247, 215, 126, 0.1), inset 0 0 30px rgba(255,255,255,0.02);
      overflow: hidden;
    }

    .topbar {
      position: absolute;
      left: 18px;
      top: 14px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(100% - 36px);
      pointer-events: none;
    }

    .pill {
      background: rgba(12, 18, 30, 0.8);
      border: 1px solid rgba(247, 215, 126, 0.7);
      color: var(--gold);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      box-shadow: 0 0 12px rgba(247, 215, 126, 0.15);
    }

    .switchrow {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .mini-btn {
      background: rgba(18, 23, 34, 0.8);
      border: 1px solid rgba(104, 245, 167, 0.75);
      color: var(--green);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .mini-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(104, 245, 167, 0.2);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0d2230, #081922 50%, #07151c);
      image-rendering: auto;
    }

    .sidebar {
      width: 340px;
      background: rgba(12, 18, 30, 0.96);
      border: 2px solid rgba(247, 215, 126, 0.82);
      border-radius: 14px;
      padding: 14px;
      box-shadow: inset 0 0 16px rgba(255,255,255,0.02);
      overflow-y: auto;
    }

    .panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .panel-title {
      color: var(--gold);
      margin: 0 0 10px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .stand-name {
      color: var(--pink);
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px;
      text-shadow: 0 0 14px rgba(255, 103, 215, 0.45);
    }

    .stand-desc {
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
      margin: 0;
      opacity: 0.9;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text);
      margin: 7px 0;
    }

    .stat-value {
      color: var(--green);
      font-weight: 700;
    }

    .bar {
      height: 14px;
      width: 100%;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.5);
      overflow: hidden;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .bar-fill {
      width: 100%;
      height: 100%;
      transition: width 0.12s linear;
    }

    .bar-fill.hp { background: linear-gradient(90deg,#38d47d,#71f4a4); }
    .bar-fill.stamina { background: linear-gradient(90deg,#ff9d2d,#ffd669); }
    .bar-fill.power { background: linear-gradient(90deg,#ff5dd7,#bd6cff); }

    .ability-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .ability-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(247, 215, 126, 0.55);
      background: rgba(247, 215, 126, 0.05);
      color: #f4ecff;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      user-select: none;
    }

    .ability-item:hover {
      transform: translateX(2px);
      border-color: rgba(247, 215, 126, 1);
      background: rgba(247, 215, 126, 0.1);
    }

    .ability-item.cooldown {
      opacity: 0.55;
      filter: grayscale(0.15);
    }

    .ability-name {
      font-size: 12px;
      font-weight: 700;
    }

    .ability-meta {
      font-size: 10px;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }

    .ability-key {
      min-width: 24px;
      text-align: center;
      display: inline-block;
      background: rgba(104, 245, 167, 0.12);
      border: 1px solid rgba(104, 245, 167, 0.7);
      color: var(--green);
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 11px;
      font-weight: 700;
    }

    .controls {
      font-size: 12px;
      line-height: 1.7;
      color: #ebf0ff;
    }

    .kbd {
      display: inline-block;
      min-width: 20px;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      font-weight: 700;
      text-align: center;
    }

    .menu {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.84);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .menu.hidden {
      display: none;
    }

    .menu-box {
      width: min(820px, 90vw);
      background: rgba(16, 22, 36, 0.97);
      border: 2px solid rgba(247, 215, 126, 0.9);
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.4);
    }

    .menu-box h2 {
      margin: 0 0 18px;
      text-align: center;
      color: var(--gold);
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .stand-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(160px, 1fr));
      gap: 14px;
    }

    .stand-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: 0.12s ease;
      min-height: 116px;
    }

    .stand-card:hover {
      transform: translateY(-2px);
      border-color: rgba(247, 215, 126, 0.8);
      box-shadow: 0 12px 18px rgba(0,0,0,0.2);
    }

    .stand-card.selected {
      background: rgba(247, 215, 126, 0.08);
      border-color: rgba(247, 215, 126, 1);
      box-shadow: 0 0 18px rgba(247, 215, 126, 0.16);
    }

    .stand-card h3 {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 16px;
    }

    .stand-card p {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      color: #dfe8ff;
    }

    .start-btn {
      display: block;
      margin: 22px auto 0;
      border: none;
      background: linear-gradient(180deg, #f5d77b, #ddaf57);
      color: #1a1200;
      border-radius: 10px;
      padding: 12px 26px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 24px rgba(247, 215, 126, 0.22);
    }

    .start-btn:hover { filter: brightness(1.05); }
  </style>
</head>

      <div class="panel">
        <div class="panel-title">Controls</div>

          <div><span class="kbd">Q</span> Toggle stand</div>

          <div><span class="kbd">E/R/T/G/V/C/X/Z</span> Skills</div>
          <div><span class="kbd">R</span> Restart</div>

    </aside>
  </div>

      <div id="standGrid" class="stand-grid"></div>
      <button id="startBattleBtn" class="start-btn">Start Battle</button>
    </div>
  </div>

          { key: 'X', name: 'Null Barrage', cost: 30, cooldown: 3.8, damage: 48, kind: 'barrage', range: 180 },
          { key: 'Z', name: 'Time Void', cost: 75, cooldown: 17, damage: 100, kind: 'ultimate', range: 250 }
        ]
      }
    };

    const state = {
      mode: 'menu',
      selectedStand: 'The World',
      started: false,
      player: null,
      enemies: [],
      projectiles: [],
      particles: [],
      wave: 1,
      score: 0,
      nextWaveTimer: 0,
      killFeed: [],
      camera: { x: 0, y: 0 },
      timeStopTimer: 0,
      lastTs: 0,
      standCooldownMap: {} 
    };

    const input = {
      keys: {},
      mouseX: 0,
      mouseY: 0,
      mouseDown: false
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function buildStandMenu() {
      const grid = document.getElementById('standGrid');
      grid.innerHTML = '';
      for (const name of Object.keys(standDefs)) {
        const card = document.createElement('div');
        card.className = 'stand-card';
        if (name === state.selectedStand) card.classList.add('selected');
        card.innerHTML = '<h3>' + name + '</h3><p>' + standDefs[name].desc + '</p>';
        card.addEventListener('click', () => {
          state.selectedStand = name;
          document.querySelectorAll('.stand-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
        });
        grid.appendChild(card);
      }
    }

    function startBattle() {
      const standName = state.selectedStand;
      const def = standDefs[standName];
      state.started = true;
      state.mode = 'game';
      state.wave = 1;
      state.score = 0;
      state.nextWaveTimer = 0;
      state.timeStopTimer = 0;
      state.enemies = [];
      state.projectiles = [];
      state.particles = [];
      state.camera.x = 0;
      state.camera.y = 0;
      state.player = {
        x: WORLD_WIDTH / 2,
        y: WORLD_HEIGHT / 2,
        r: 16,
        speed: 3.2,
        hp: 100,
        maxHp: 100,
        stamina: 100,
        maxStamina: 100,
        power: 100,
        maxPower: 100,
        direction: 0,
        standActive: false,
        invuln: 0,
        damageMultiplier: 1,
        standName,
        abilities: JSON.parse(JSON.stringify(def.abilities)),
        meleeCooldown: 0,
        dashCooldown: 0,
        lastHit: 0
      };
      document.getElementById('menuOverlay').classList.add('hidden');
      updateStandInfo();
      spawnWave();
    }

    function resetBattle() {
      state.started = false;
      state.mode = 'menu';
      document.getElementById('menuOverlay').classList.remove('hidden');
      buildStandMenu();
    }

    function updateStandInfo() {
      const p = state.player;
      if (!p) return;
      const def = standDefs[p.standName];
      document.getElementById('standName').textContent = def.name;
      document.getElementById('standDesc').textContent = def.desc;
      document.getElementById('toggleStandBtn').textContent = p.standActive ? 'Stand: Active' : 'Stand: Dormant';
    }

    function updateSidebarAbilityList() {
      const p = state.player;
      const list = document.getElementById('abilityList');
      if (!p || !list) return;
      const def = standDefs[p.standName];
      list.innerHTML = '';
      for (const ability of def.abilities) {
        const div = document.createElement('div');
        div.className = 'ability-item';
        const now = performance.now() / 1000;
        const cdEnd = state.standCooldownMap[ability.key] || 0;
        const onCooldown = now < cdEnd;
        if (onCooldown) div.classList.add('cooldown');

        const label = onCooldown ? `${(cdEnd - now).toFixed(1)}s` : `${ability.cost} power`;
        div.innerHTML = `
          <div>
            <span class="ability-name">${ability.name}</span>
            <span class="ability-meta">${label}</span>
          </div>
          <span class="ability-key">${ability.key}</span>
        `;
        div.addEventListener('click', () => {
          if (p.standActive) castAbility(ability);
        });
        list.appendChild(div);
      }
    }

    function updateHUD() {
      const p = state.player; if (!p) return;
      document.getElementById('hpText').textContent = `${Math.ceil(p.hp)} / ${p.maxHp}`;
      document.getElementById('staminaText').textContent = `${Math.ceil(p.stamina)} / ${p.maxStamina}`;
      document.getElementById('powerText').textContent = `${Math.ceil(p.power)} / ${p.maxPower}`;
      document.getElementById('hpBar').style.width = `${(p.hp / p.maxHp) * 100}%`;
      document.getElementById('staminaBar').style.width = `${(p.stamina / p.maxStamina) * 100}%`;
      document.getElementById('powerBar').style.width = `${(p.power / p.maxPower) * 100}%`;
      document.getElementById('waveLabel').textContent = `Wave ${state.wave}` + (state.wave % 10 === 0 ? ' • Boss' : '');
      updateStandInfo();
      updateSidebarAbilityList();
    }

    function toggleStand() {
      if (!state.player) return;
      state.player.standActive = !state.player.standActive;
      updateStandInfo();
      if (state.player.standActive) {
        createBurst(state.player.x, state.player.y, standDefs[state.player.standName].accent, 16, 0.8);
      }
    }

    function spawnWave() {
      const bossWave = state.wave % 10 === 0;
      const count = bossWave ? 1 : 5 + Math.floor(state.wave * 1.4);
      state.enemies = [];
      for (let i = 0; i < count; i++) {
        const side = Math.floor(Math.random() * 4);
        let x = 0, y = 0;
        if (side === 0) { x = Math.random() * WORLD_WIDTH; y = -30; }
        else if (side === 1) { x = WORLD_WIDTH + 30; y = Math.random() * WORLD_HEIGHT; }
        else if (side === 2) { x = Math.random() * WORLD_WIDTH; y = WORLD_HEIGHT + 30; }
        else { x = -30; y = Math.random() * WORLD_HEIGHT; }

        const maxHp = bossWave ? 220 + state.wave * 35 : 26 + state.wave * 4;
        state.enemies.push({
          x, y,
          r: bossWave ? 30 : 16 + Math.random() * 4,
          hp: maxHp,
          maxHp,
          speed: bossWave ? 0.9 + state.wave * 0.04 : 0.8 + Math.random() * 1.2,
          color: bossWave ? '#ff5b5b' : '#4ee18d',
          type: bossWave ? 'boss' : ['runner', 'shooter', 'tank'][Math.floor(Math.random() * 3)],
          shootCooldown: bossWave ? 1.1 : 1.5 + Math.random() * 1.3,
          hitFlash: 0,
          value: bossWave ? 120 : 12 + state.wave * 2
        });
      }
      state.nextWaveTimer = 0;
    }

    function createBurst(x, y, color, n = 20, life = 0.8) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const speed = 0.5 + Math.random() * 2.5;
        state.particles.push({
          x, y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          r: 2 + Math.random() * 4,
          color,
          life, maxLife: life,
          type: 'spark'
        });
      }
    }

    function createText(x, y, text, color = '#ff7d9d') {
      state.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 0.6,
        vy: -0.7,
        text,
        color,
        life: 0.8,
        maxLife: 0.8,
        type: 'text'
      });
    }

    function damageEnemy(enemy, amount, atX, atY) {
      if (!enemy || enemy.hp <= 0) return;
      enemy.hp -= amount;
      enemy.hitFlash = 0.2;
      createText(atX, atY, `-${Math.round(amount)}`, '#ff8ca4');
      if (enemy.hp <= 0) {
        state.score += enemy.value || 10;
        state.player.power = clamp(state.player.power + 12, 0, state.player.maxPower);
        state.enemies = state.enemies.filter(e => e !== enemy);
        createBurst(enemy.x, enemy.y, enemy.color, 25, 1.0);
        if (enemy.type === 'boss') {
          state.player.maxHp += 18;
          state.player.hp = state.player.maxHp;
          state.player.damageMultiplier *= 1.12;
          state.player.power = state.player.maxPower;
        }
      }
    }

    function castAbility(ability) {
      const p = state.player;
      if (!p || !p.standActive) return;
      const now = performance.now() / 1000;
      const key = ability.key;
      const cdEnd = state.standCooldownMap[key] || 0;
      if (now < cdEnd || p.power < ability.cost) return;
      state.standCooldownMap[key] = now + ability.cooldown;
      p.power -= ability.cost;

      const angle = p.direction || 0;
      const cx = p.x + Math.cos(angle) * 38;
      const cy = p.y + Math.sin(angle) * 38;

      if (ability.kind === 'melee') {
        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - cx, enemy.y - cy) < ability.range + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMultiplier, enemy.x, enemy.y);
          }
        }
        createBurst(cx, cy, standDefs[p.standName].accent, 14, 0.7);
      }

      if (ability.kind === 'projectile') {
        state.projectiles.push({
          x: cx, y: cy,
          angle,
          speed: 8,
          damage: ability.damage * p.damageMultiplier,
          radius: 5,
          owner: 'player',
          color: standDefs[p.standName].color,
          life: 2.6,
          kind: ability.name
        });
      }

      if (ability.kind === 'slash') {
        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - cx, enemy.y - cy) < ability.range + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMultiplier, enemy.x, enemy.y);
          }
        }
        createBurst(cx, cy, standDefs[p.standName].color, 20, 0.9);
      }

      if (ability.kind === 'dash') {
        const dist = ability.range || 150;
        p.x = clamp(p.x + Math.cos(angle) * dist, 30, WORLD_WIDTH - 30);
        p.y = clamp(p.y + Math.sin(angle) * dist, 30, WORLD_HEIGHT - 30);
        createBurst(p.x, p.y, standDefs[p.standName].accent, 18, 0.8);
        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - p.x, enemy.y - p.y) < 90 + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMultiplier, enemy.x, enemy.y);
          }
        }
      }

      if (ability.kind === 'burst') {
        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - cx, enemy.y - cy) < ability.range + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMultiplier, enemy.x, enemy.y);
          }
        }
        createBurst(cx, cy, standDefs[p.standName].color, 28, 1.1);
      }

      if (ability.kind === 'aoe') {
        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - p.x, enemy.y - p.y) < ability.range + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMultiplier, enemy.x, enemy.y);
          }
        }
        createBurst(p.x, p.y, standDefs[p.standName].color, 32, 1.2);
      }

      if (ability.kind === 'heal') {
        p.hp = clamp(p.hp + 24, 0, p.maxHp);
        createText(p.x, p.y - 25, '+24', '#7af7b9');
      }

      if (ability.kind === 'timestop') {
        state.timeStopTimer = 1.8;
        createBurst(p.x, p.y, '#ffd76b', 36, 1.5);
      }

      if (ability.kind === 'blink') {
        p.x = clamp(p.x + Math.cos(angle) * 110, 30, WORLD_WIDTH - 30);
        p.y = clamp(p.y + Math.sin(angle) * 110, 30, WORLD_HEIGHT - 30);
        createBurst(p.x, p.y, standDefs[p.standName].color, 20, 0.8);
      }

      if (ability.kind === 'stun') {
        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - p.x, enemy.y - p.y) < 180 + enemy.r) {
            enemy.hitFlash = 0.8;
            enemy.speed *= 0.35;
          }
        }
        createBurst(p.x, p.y, standDefs[p.standName].accent, 24, 1.0);
      }

      if (ability.kind === 'skip') {
        state.timeStopTimer = 1.2;
        p.x = clamp(p.x + Math.cos(angle) * 70, 30, WORLD_WIDTH - 30);
        p.y = clamp(p.y + Math.sin(angle) * 70, 30, WORLD_HEIGHT - 30);
      }

      if (ability.kind === 'ultimate') {
        for (const enemy of state.enemies) {
          if (Math.hypot(enemy.x - p.x, enemy.y - p.y) < ability.range + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMultiplier, enemy.x, enemy.y);
          }
        }
        createBurst(p.x, p.y, standDefs[p.standName].accent, 40, 1.7);
      }
    }

    function playerMelee() {
      const p = state.player;
      if (!p) return;
      const now = performance.now() / 1000;
      if (now < p.meleeCooldown) return;
      p.meleeCooldown = now + 0.18;
      const angle = p.direction || 0;
      const cx = p.x + Math.cos(angle) * 38;
      const cy = p.y + Math.sin(angle) * 38;
      for (const enemy of state.enemies) {
        if (Math.hypot(enemy.x - cx, enemy.y - cy) < 72 + enemy.r) {
          damageEnemy(enemy, 12 * p.damageMultiplier, enemy.x, enemy.y);
        }
      }
      createBurst(cx, cy, standDefs[p.standName].accent, 12, 0.6);
    }

    function updatePlayer(dt) {
      const p = state.player;
      if (!p) return;

      let dx = 0, dy = 0;
      if (input.keys['w'] || input.keys['W'] || input.keys['ArrowUp']) dy -= 1;
      if (input.keys['s'] || input.keys['S'] || input.keys['ArrowDown']) dy += 1;
      if (input.keys['a'] || input.keys['A'] || input.keys['ArrowLeft']) dx -= 1;
      if (input.keys['d'] || input.keys['D'] || input.keys['ArrowRight']) dx += 1;

      if (dx || dy) {
        const len = Math.hypot(dx, dy) || 1;
        p.x += (dx / len) * p.speed * 60 * dt;
        p.y += (dy / len) * p.speed * 60 * dt;
      }

      p.x = clamp(p.x, 20, WORLD_WIDTH - 20);
      p.y = clamp(p.y, 20, WORLD_HEIGHT - 20);
      p.stamina = clamp(p.stamina + 22 * dt, 0, p.maxStamina);
      p.power = clamp(p.power + 4.2 * dt, 0, p.maxPower);
      p.invuln = Math.max(0, p.invuln - dt);

      state.camera.x = clamp(p.x - VIEW_WIDTH / 2, 0, WORLD_WIDTH - VIEW_WIDTH);
      state.camera.y = clamp(p.y - VIEW_HEIGHT / 2, 0, WORLD_HEIGHT - VIEW_HEIGHT);
    }

    function updateEnemies(dt) {
      const p = state.player;
      if (!p) return;
      for (const enemy of state.enemies) {
        const dx = p.x - enemy.x;
        const dy = p.y - enemy.y;
        const d = Math.hypot(dx, dy) || 1;

        if (state.timeStopTimer > 0) {
          enemy.hitFlash = Math.max(0, enemy.hitFlash - dt * 2);
          continue;
        }

        enemy.x += (dx / d) * enemy.speed * 60 * dt;
        enemy.y += (dy / d) * enemy.speed * 60 * dt;
        enemy.hitFlash = Math.max(0, enemy.hitFlash - dt * 2);

        if (enemy.type === 'shooter' || enemy.type === 'boss') {
          enemy.shootCooldown -= dt;
          if (enemy.shootCooldown <= 0) {
            enemy.shootCooldown = enemy.type === 'boss' ? 0.9 : 1.4 + Math.random() * 0.8;
            const angle = Math.atan2(p.y - enemy.y, p.x - enemy.x);
            state.projectiles.push({
              x: enemy.x, y: enemy.y,
              angle,
              speed: enemy.type === 'boss' ? 6 : 4,
              damage: enemy.type === 'boss' ? 12 : 8,
              radius: enemy.type === 'boss' ? 7 : 5,
              owner: 'enemy',
              color: '#ffbf5c',
              life: 3,
              kind: 'enemy-projectile'
            });
          }
        }

        if (Math.hypot(p.x - enemy.x, p.y - enemy.y) < p.r + enemy.r + 5 && p.invuln <= 0) {
          p.hp -= enemy.type === 'boss' ? 16 : 10;
          p.invuln = 0.7;
          createText(p.x, p.y - 20, `-${enemy.type === 'boss' ? 16 : 10}`, '#ff7d7d');
          if (p.hp <= 0) {
            state.mode = 'over';
          }
        }
      }
    }

    function updateProjectiles(dt) {
      for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const proj = state.projectiles[i];
        if (state.timeStopTimer > 0) continue;
        proj.x += Math.cos(proj.angle) * proj.speed * 60 * dt;
        proj.y += Math.sin(proj.angle) * proj.speed * 60 * dt;
        proj.life -= dt;

        if (proj.owner === 'player') {
          for (const enemy of state.enemies) {
            if (Math.hypot(enemy.x - proj.x, enemy.y - proj.y) <= enemy.r + proj.radius) {
              damageEnemy(enemy, proj.damage, proj.x, proj.y);
              state.projectiles.splice(i, 1);
              break;
            }
          }
        } else {
          const p = state.player;
          if (p && Math.hypot(p.x - proj.x, p.y - proj.y) <= p.r + proj.radius + 2) {
            p.hp -= proj.damage;
            p.invuln = 0.45;
            createText(p.x, p.y - 20, `-${proj.damage}`, '#ff7d7d');
            if (p.hp <= 0) state.mode = 'over';
            state.projectiles.splice(i, 1);
            continue;
          }
        }

        if (proj.life <= 0 || proj.x < -60 || proj.x > WORLD_WIDTH + 60 || proj.y < -60 || proj.y > WORLD_HEIGHT + 60) {
          state.projectiles.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.life -= dt;
        if (p.type === 'spark') {
          p.x += p.vx * 60 * dt;
          p.y += p.vy * 60 * dt;
        } else {
          p.x += p.vx * 60 * dt;
          p.y += p.vy * 60 * dt;
        }
        if (p.life <= 0) {
          state.particles.splice(i, 1);
        }
      }
    }

    function updateWave(dt) {
      if (state.mode !== 'game' || state.player == null) return;
      if (state.enemies.length === 0) {
        state.nextWaveTimer -= dt;
        if (state.nextWaveTimer <= 0) {
          state.wave += 1;
          spawnWave();
        }
      }
    }

    function drawBackground() {
      const bg = ctx.createLinearGradient(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
      bg.addColorStop(0, '#0b2234');
      bg.addColorStop(1, '#081922');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

      // world grid
      ctx.strokeStyle = 'rgba(255,255,255,0.045)';
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD_WIDTH; x += 40) {
        const sx = x - state.camera.x;
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, VIEW_HEIGHT);
        ctx.stroke();
      }
      for (let y = 0; y < WORLD_HEIGHT; y += 40) {
        const sy = y - state.camera.y;
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(VIEW_WIDTH, sy);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const p = state.player;
      if (!p) return;
      const px = p.x - state.camera.x;
      const py = p.y - state.camera.y;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(p.direction || 0);
      if (p.standActive) {
        ctx.shadowColor = standDefs[p.standName].accent;
        ctx.shadowBlur = 18;
      }
      ctx.fillStyle = p.standActive ? standDefs[p.standName].color : '#f6f3ff';
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1d2330';
      ctx.beginPath();
      ctx.arc(5, -2, 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#7ef0a3';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(p.r + 18, 0);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(px - 22, py - 28, 44, 6);
      ctx.fillStyle = '#5af28d';
      ctx.fillRect(px - 22, py - 28, 44 * (p.hp / p.maxHp), 6);
    }

    function drawEnemies() {
      for (const enemy of state.enemies) {
        const ex = enemy.x - state.camera.x;
        const ey = enemy.y - state.camera.y;
        ctx.save();
        ctx.translate(ex, ey);
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        ctx.arc(0, 0, enemy.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(ex - enemy.r, ey - enemy.r - 12, enemy.r * 2, 6);
        ctx.fillStyle = '#69f5a7';
        ctx.fillRect(ex - enemy.r, ey - enemy.r - 12, (enemy.hp / enemy.maxHp) * enemy.r * 2, 6);
      }
    }

    function drawProjectiles() {
      for (const proj of state.projectiles) {
        if (proj.owner === 'player') {
          ctx.fillStyle = '#7ddcff';
        } else {
          ctx.fillStyle = '#ffb55c';
        }
        const px = proj.x - state.camera.x;
        const py = proj.y - state.camera.y;
        ctx.beginPath();
        ctx.arc(px, py, proj.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        const px = p.x - state.camera.x;
        const py = p.y - state.camera.y;
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        if (p.type === 'text') {
          ctx.fillStyle = p.color;
          ctx.font = '700 14px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(p.text, px, py);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(px, py, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawGameOver() {
      if (state.mode !== 'over') return;
      ctx.fillStyle = 'rgba(3, 5, 12, 0.72)';
      ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = '700 34px Arial';
      ctx.fillText('Battle Lost', VIEW_WIDTH / 2, VIEW_HEIGHT / 2 - 10);
      ctx.font = '20px Arial';
      ctx.fillText('Press R to restart or choose another stand', VIEW_WIDTH / 2, VIEW_HEIGHT / 2 + 28);
      ctx.textAlign = 'left';
    }

    function drawStandAura() {
      const p = state.player;
      if (!p || !p.standActive) return;
      const px = p.x - state.camera.x;
      const py = p.y - state.camera.y;
      ctx.beginPath();
      ctx.arc(px, py, 38 + Math.sin(performance.now() * 0.02) * 6, 0, Math.PI * 2);
      ctx.strokeStyle = standDefs[p.standName].color;
      ctx.lineWidth = 2;
      ctx.shadowColor = standDefs[p.standName].color;
      ctx.shadowBlur = 16;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function gameLoop() {
      const now = performance.now();
      const dt = Math.min((now - (state.lastTs || now)) / 1000, 0.033);
      state.lastTs = now;

      if (state.mode === 'game' && state.player) {
        updatePlayer(dt);
        updateEnemies(dt);
        updateProjectiles(dt);
        updateParticles(dt);
        updateWave(dt);
        if (state.timeStopTimer > 0) state.timeStopTimer -= dt;
        updateHUD();
      }

      drawBackground();
      if (state.player) {
        drawStandAura();
        drawProjectiles();
        drawEnemies();
        drawPlayer();
        drawParticles();
      }
      drawGameOver();
      requestAnimationFrame(gameLoop);
    }

    document.getElementById('startBattleBtn').addEventListener('click', startBattle);
    document.getElementById('toggleStandBtn').addEventListener('click', toggleStand);

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      input.keys[e.key] = true;
      input.keys[key] = true;

      if (state.mode === 'game' && state.player) {
        if (key === 'q') toggleStand();
        if (key === 'r' && state.mode === 'over') {
          resetBattle();
        }
        const ability = state.player.abilities.find(a => a.key.toLowerCase() === key);
        if (ability) castAbility(ability);
      }
    });

    document.addEventListener('keyup', (e) => {
      input.keys[e.key] = false;
      input.keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      input.mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
      input.mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
      if (state.player) {
        state.player.direction = Math.atan2(
          input.mouseY + state.camera.y - state.player.y,
          input.mouseX + state.camera.x - state.player.x
        );
      }
    });

    canvas.addEventListener('mousedown', () => {
      if (state.mode === 'game' && state.player) playerMelee();
    });

    buildStandMenu();
    updateHUD();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
