<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoJo Stand Wave Battle</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      color: #f0f0f0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      padding: 10px;
    }
    .game-canvas {
      flex: 1;
      background: #0d1620;
      border: 2px solid #f5d77b;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      width: 300px;
      background: rgba(20, 25, 40, 0.95);
      border: 2px solid #f5d77b;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel {
      background: rgba(30, 35, 50, 0.8);
      border: 1px solid rgba(245, 215, 123, 0.5);
      border-radius: 6px;
      padding: 12px;
    }
    .title {
      color: #f5d77b;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin: 6px 0;
      color: #e0e0e0;
    }
    .stat-value {
      color: #7ef29b;
      font-weight: bold;
    }
    .bar {
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(245, 215, 123, 0.3);
      border-radius: 4px;
      margin-top: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #5ef29b, #8ef7b5);
      width: 100%;
      transition: width 0.1s linear;
    }
    .bar-fill.stamina {
      background: linear-gradient(90deg, #ffa500, #ffd700);
    }
    .bar-fill.power {
      background: linear-gradient(90deg, #ff4db8, #c867ff);
    }
    .ability-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ability-btn {
      background: rgba(245, 215, 123, 0.08);
      border: 1px solid rgba(245, 215, 123, 0.6);
      color: #f0f0f0;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s ease;
    }
    .ability-btn:hover {
      background: rgba(245, 215, 123, 0.15);
      border-color: #f5d77b;
    }
    .ability-btn.cooldown {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .key-badge {
      background: rgba(126, 242, 155, 0.2);
      border: 1px solid rgba(126, 242, 155, 0.6);
      color: #7ef29b;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 10px;
    }
    .menu {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .menu-box {
      background: rgba(20, 25, 40, 0.95);
      border: 2px solid #f5d77b;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      max-width: 600px;
    }
    .menu-box h1 {
      color: #f5d77b;
      margin: 0 0 20px;
      font-size: 28px;
    }
    .stand-select {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .stand-card {
      background: rgba(30, 35, 50, 0.8);
      border: 2px solid rgba(245, 215, 123, 0.4);
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .stand-card:hover {
      border-color: #f5d77b;
      background: rgba(245, 215, 123, 0.1);
    }
    .stand-card.selected {
      border-color: #f5d77b;
      background: rgba(245, 215, 123, 0.15);
      box-shadow: 0 0 15px rgba(245, 215, 123, 0.3);
    }
    .stand-card h3 {
      color: #f5d77b;
      margin: 0 0 8px;
      font-size: 16px;
    }
    .stand-card p {
      color: #d0d0d0;
      font-size: 12px;
      margin: 0;
      line-height: 1.4;
    }
    .start-btn {
      background: linear-gradient(180deg, #f5d77b, #e6b85a);
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.15s ease;
    }
    .start-btn:hover {
      filter: brightness(1.1);
    }
    .hidden {
      display: none !important;
    }
    .overlay-text {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: #f5d77b;
      padding: 12px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      pointer-events: none;
    }
    .float-info {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: #e0e0e0;
      padding: 12px 18px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-canvas">
      <canvas id="gameCanvas"></canvas>
      <div class="overlay-text" id="waveText">Wave 1</div>
      <div class="float-info" id="infoText">Stand: Dormant</div>
    </div>

    <div class="hud">
      <div class="panel">
        <div class="title">Stand Info</div>
        <h3 id="standTitle" style="color: #ff67d7; margin: 0 0 8px; font-size: 18px;">The World</h3>
        <p id="standDesc" style="color: #d0d0d0; font-size: 12px; margin: 0; line-height: 1.4;">Select a stand to begin</p>
      </div>

      <div class="panel">
        <div class="title">Status</div>
        <div class="stat-row">
          <span>Health</span>
          <span class="stat-value" id="hpText">100 / 100</span>
        </div>
        <div class="bar"><div id="hpBar" class="bar-fill"></div></div>

        <div class="stat-row">
          <span>Stamina</span>
          <span class="stat-value" id="stamText">100 / 100</span>
        </div>
        <div class="bar"><div id="stamBar" class="bar-fill stamina"></div></div>

        <div class="stat-row">
          <span>Stand Power</span>
          <span class="stat-value" id="powText">100 / 100</span>
        </div>
        <div class="bar"><div id="powBar" class="bar-fill power"></div></div>
      </div>

      <div class="panel">
        <div class="title">Abilities</div>
        <div id="abilityList" class="ability-list"></div>
      </div>

      <div class="panel">
        <div class="title">Controls</div>
        <div style="font-size: 11px; line-height: 1.6; color: #e0e0e0;">
          <div><strong>WASD</strong> - Move</div>
          <div><strong>Mouse</strong> - Aim</div>
          <div><strong>Q</strong> - Toggle Stand</div>
          <div><strong>LMB</strong> - M1 Attack</div>
          <div><strong>E-Z</strong> - Abilities</div>
          <div><strong>R</strong> - Restart</div>
        </div>
      </div>
    </div>
  </div>

  <div id="menuOverlay" class="menu">
    <div class="menu-box">
      <h1>Select Your Stand</h1>
      <div class="stand-select" id="standSelect"></div>
      <button class="start-btn" id="startGameBtn">Start Battle</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let W = 900, H = 640;

    function resizeCanvas() {
      const container = canvas.parentElement;
      W = container.clientWidth;
      H = container.clientHeight;
      canvas.width = W;
      canvas.height = H;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stands = {
      'The World': {
        name: 'The World',
        desc: 'Time-controlling stand. Unleash barrages and devastating punches.',
        color: '#c59eff',
        abilities: [
          { key: 'E', name: 'Barrage', cost: 10, cooldown: 0.4, damage: 15, type: 'barrage' },
          { key: 'R', name: 'Heavy Punch', cost: 15, cooldown: 1.2, damage: 30, type: 'melee' },
          { key: 'T', name: 'Knife Throw', cost: 12, cooldown: 0.8, damage: 20, type: 'projectile' },
          { key: 'G', name: 'Time Stop', cost: 40, cooldown: 10, damage: 0, type: 'timestop' },
          { key: 'V', name: 'World Slash', cost: 20, cooldown: 2, damage: 35, type: 'slash' },
          { key: 'C', name: 'Ora Kick', cost: 18, cooldown: 1.5, damage: 28, type: 'melee' },
          { key: 'X', name: 'Hammer Smash', cost: 22, cooldown: 2.2, damage: 40, type: 'melee' },
          { key: 'Z', name: 'Za Warudo!', cost: 60, cooldown: 12, damage: 80, type: 'ultimate' }
        ]
      },
      'Silver Chariot': {
        name: 'Silver Chariot',
        desc: 'Swift swordsman with rapid elegant strikes.',
        color: '#d9e8ff',
        abilities: [
          { key: 'E', name: 'Quick Slash', cost: 10, cooldown: 0.35, damage: 14, type: 'slash' },
          { key: 'R', name: 'Lunging Thrust', cost: 14, cooldown: 1, damage: 25, type: 'projectile' },
          { key: 'T', name: 'Arc Strike', cost: 16, cooldown: 1.2, damage: 28, type: 'slash' },
          { key: 'G', name: 'Charge Attack', cost: 18, cooldown: 1.8, damage: 32, type: 'melee' },
          { key: 'V', name: 'Sword Rain', cost: 22, cooldown: 2.4, damage: 38, type: 'barrage' },
          { key: 'C', name: 'Armor Break', cost: 20, cooldown: 2, damage: 34, type: 'melee' },
          { key: 'X', name: 'Silver Storm', cost: 28, cooldown: 3.5, damage: 45, type: 'barrage' },
          { key: 'Z', name: 'Golden Rush', cost: 65, cooldown: 13, damage: 85, type: 'ultimate' }
        ]
      },
      "Magician's Red": {
        name: "Magician's Red",
        desc: 'Fiery stand with relentless flame pressure.',
        color: '#ff7a45',
        abilities: [
          { key: 'E', name: 'Flame Punch', cost: 11, cooldown: 0.45, damage: 16, type: 'melee' },
          { key: 'R', name: 'Fireball', cost: 13, cooldown: 0.9, damage: 22, type: 'projectile' },
          { key: 'T', name: 'Heat Wave', cost: 17, cooldown: 1.4, damage: 30, type: 'slash' },
          { key: 'G', name: 'Meteor Storm', cost: 24, cooldown: 2.3, damage: 36, type: 'barrage' },
          { key: 'V', name: 'Inferno', cost: 26, cooldown: 2.8, damage: 40, type: 'aoe' },
          { key: 'C', name: 'Fire Floor', cost: 20, cooldown: 2, damage: 32, type: 'aoe' },
          { key: 'X', name: 'Phoenix Rush', cost: 30, cooldown: 4, damage: 48, type: 'dash' },
          { key: 'Z', name: 'Burning Inferno', cost: 70, cooldown: 14, damage: 90, type: 'ultimate' }
        ]
      },
      'D4C': {
        name: 'D4C',
        desc: 'Dimensional stand with unpredictable clone tactics.',
        color: '#7bd3ff',
        abilities: [
          { key: 'E', name: 'Dimension Cut', cost: 10, cooldown: 0.4, damage: 16, type: 'slash' },
          { key: 'R', name: 'Clone Rush', cost: 16, cooldown: 1.1, damage: 26, type: 'barrage' },
          { key: 'T', name: 'Portal Bolt', cost: 14, cooldown: 0.95, damage: 24, type: 'projectile' },
          { key: 'G', name: 'Dimension Swap', cost: 16, cooldown: 3, damage: 0, type: 'dash' },
          { key: 'V', name: 'Reality Ripple', cost: 18, cooldown: 1.5, damage: 28, type: 'slash' },
          { key: 'C', name: 'Gap Sphere', cost: 20, cooldown: 2.2, damage: 34, type: 'aoe' },
          { key: 'X', name: 'Portal Stream', cost: 26, cooldown: 3.8, damage: 44, type: 'projectile' },
          { key: 'Z', name: 'World Break', cost: 72, cooldown: 15, damage: 92, type: 'ultimate' }
        ]
      }
    };

    const gameState = {
      mode: 'menu',
      selectedStand: 'The World',
      running: false,
      player: null,
      enemies: [],
      projectiles: [],
      particles: [],
      wave: 1,
      score: 0,
      waveInProgress: false,
      nextWaveTimer: 0,
      timeStopTimer: 0,
      buffs: []
    };

    const input = {
      keys: {},
      mouse: { x: W / 2, y: H / 2 }
    };

    function initMenu() {
      const selectContainer = document.getElementById('standSelect');
      selectContainer.innerHTML = '';
      Object.keys(stands).forEach(standName => {
        const card = document.createElement('div');
        card.className = 'stand-card';
        if (standName === 'The World') card.classList.add('selected');
        card.innerHTML = `<h3>${standName}</h3><p>${stands[standName].desc}</p>`;
        card.addEventListener('click', () => {
          document.querySelectorAll('.stand-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          gameState.selectedStand = standName;
        });
        selectContainer.appendChild(card);
      });

      document.getElementById('startGameBtn').addEventListener('click', startGame);
    }

    function startGame() {
      document.getElementById('menuOverlay').classList.add('hidden');
      gameState.mode = 'game';
      gameState.running = true;
      gameState.wave = 1;
      gameState.score = 0;
      gameState.buffs = [];

      const standName = gameState.selectedStand;
      const standDef = stands[standName];

      gameState.player = {
        x: W / 2,
        y: H / 2,
        r: 14,
        speed: 2.5,
        hp: 100,
        maxHp: 100,
        stamina: 100,
        maxStamina: 100,
        power: 100,
        maxPower: 100,
        direction: 0,
        standActive: false,
        invuln: 0,
        damageMultiplier: 1.0,
        standName: standName,
        abilities: JSON.parse(JSON.stringify(standDef.abilities))
      };

      gameState.enemies = [];
      gameState.projectiles = [];
      gameState.particles = [];
      gameState.waveInProgress = false;
      spawnWave();
    }

    function spawnWave() {
      gameState.enemies = [];
      const count = 5 + gameState.wave * 1.5;
      const isBossWave = gameState.wave % 10 === 0;

      for (let i = 0; i < count; i++) {
        const side = Math.floor(Math.random() * 4);
        let x = 0, y = 0;
        if (side === 0) { x = Math.random() * W; y = -30; }
        else if (side === 1) { x = W + 30; y = Math.random() * H; }
        else if (side === 2) { x = Math.random() * W; y = H + 30; }
        else { x = -30; y = Math.random() * H; }

        const enemyHp = isBossWave ? 180 + gameState.wave * 20 : 20 + gameState.wave * 2;
        gameState.enemies.push({
          x, y,
          r: isBossWave ? 24 : 14,
          hp: enemyHp,
          maxHp: enemyHp,
          speed: isBossWave ? 0.8 : 0.7 + Math.random() * 1.3,
          color: isBossWave ? '#ff5555' : '#52ef7d',
          isBoss: isBossWave,
          shootCooldown: 1.5,
          hitFlash: 0
        });
      }
      gameState.waveInProgress = true;
    }

    function updateGame(deltaTime) {
      const p = gameState.player;
      if (!p) return;

      // Movement
      let mx = 0, my = 0;
      if (input.keys['w'] || input.keys['W'] || input.keys['ArrowUp']) my -= 1;
      if (input.keys['s'] || input.keys['S'] || input.keys['ArrowDown']) my += 1;
      if (input.keys['a'] || input.keys['A'] || input.keys['ArrowLeft']) mx -= 1;
      if (input.keys['d'] || input.keys['D'] || input.keys['ArrowRight']) mx += 1;

      if (mx || my) {
        const len = Math.hypot(mx, my) || 1;
        p.x += (mx / len) * p.speed * 60 * deltaTime;
        p.y += (my / len) * p.speed * 60 * deltaTime;
      }

      p.x = Math.max(20, Math.min(W - 20, p.x));
      p.y = Math.max(20, Math.min(H - 20, p.y));

      // Stamina and Power regen
      p.stamina = Math.min(p.maxStamina, p.stamina + 30 * deltaTime);
      p.power = Math.min(p.maxPower, p.power + 5 * deltaTime);
      p.invuln = Math.max(0, p.invuln - deltaTime);

      // Update enemies
      gameState.enemies.forEach(enemy => {
        const dx = p.x - enemy.x;
        const dy = p.y - enemy.y;
        const dist = Math.hypot(dx, dy) || 1;

        enemy.x += (dx / dist) * enemy.speed * 60 * deltaTime;
        enemy.y += (dy / dist) * enemy.speed * 60 * deltaTime;
        enemy.hitFlash = Math.max(0, enemy.hitFlash - deltaTime * 2);

        enemy.shootCooldown -= deltaTime;
        if (enemy.shootCooldown <= 0) {
          enemy.shootCooldown = 1.2;
          const angle = Math.atan2(p.y - enemy.y, p.x - enemy.x);
          gameState.projectiles.push({
            x: enemy.x,
            y: enemy.y,
            angle: angle,
            speed: 4,
            damage: 8,
            owner: 'enemy'
          });
        }

        if (Math.hypot(p.x - enemy.x, p.y - enemy.y) < p.r + enemy.r + 5 && p.invuln <= 0) {
          p.hp -= 10;
          p.invuln = 0.6;
          if (p.hp <= 0) gameState.running = false;
        }
      });

      // Update projectiles
      gameState.projectiles = gameState.projectiles.filter(proj => {
        proj.x += Math.cos(proj.angle) * proj.speed * 60 * deltaTime;
        proj.y += Math.sin(proj.angle) * proj.speed * 60 * deltaTime;

        if (proj.owner === 'player') {
          for (let i = gameState.enemies.length - 1; i >= 0; i--) {
            const enemy = gameState.enemies[i];
            if (Math.hypot(enemy.x - proj.x, enemy.y - proj.y) < enemy.r + 5) {
              enemy.hp -= proj.damage;
              gameState.particles.push({
                x: enemy.x, y: enemy.y,
                text: `-${Math.round(proj.damage)}`,
                life: 0.6,
                color: '#ff7688'
              });
              if (enemy.hp <= 0) {
                gameState.enemies.splice(i, 1);
                gameState.score += 10;
                p.power = Math.min(p.maxPower, p.power + 15);
              }
              return false;
            }
          }
        } else if (proj.owner === 'enemy') {
          if (Math.hypot(p.x - proj.x, p.y - proj.y) < p.r + 5) {
            p.hp -= proj.damage;
            p.invuln = 0.4;
            if (p.hp <= 0) gameState.running = false;
            return false;
          }
        }

        return proj.x > -50 && proj.x < W + 50 && proj.y > -50 && proj.y < H + 50;
      });

      // Update particles
      gameState.particles = gameState.particles.filter(part => {
        part.life -= deltaTime;
        if (part.text) part.y -= 0.5;
        return part.life > 0;
      });

      // Wave management
      if (gameState.waveInProgress && gameState.enemies.length === 0) {
        gameState.waveInProgress = false;
        gameState.nextWaveTimer = 2;
      }
      if (!gameState.waveInProgress) {
        gameState.nextWaveTimer -= deltaTime;
        if (gameState.nextWaveTimer <= 0) {
          gameState.wave += 1;
          if (gameState.wave % 10 === 0) {
            p.maxHp += 20;
            p.hp = p.maxHp;
            p.damageMultiplier *= 1.15;
          }
          spawnWave();
        }
      }

      updateHUD();
    }

    function updateHUD() {
      const p = gameState.player;
      if (!p) return;

      document.getElementById('hpText').textContent = `${Math.ceil(Math.max(0, p.hp))} / ${p.maxHp}`;
      document.getElementById('stamText').textContent = `${Math.ceil(Math.max(0, p.stamina))} / ${p.maxStamina}`;
      document.getElementById('powText').textContent = `${Math.ceil(Math.max(0, p.power))} / ${p.maxPower}`;

      document.getElementById('hpBar').style.width = `${(Math.max(0, p.hp) / p.maxHp) * 100}%`;
      document.getElementById('stamBar').style.width = `${(Math.max(0, p.stamina) / p.maxStamina) * 100}%`;
      document.getElementById('powBar').style.width = `${(Math.max(0, p.power) / p.maxPower) * 100}%`;

      const standInfo = stands[p.standName];
      document.getElementById('standTitle').textContent = p.standName;
      document.getElementById('standDesc').textContent = standInfo.desc;
      document.getElementById('infoText').textContent = `Stand: ${p.standActive ? 'Active' : 'Dormant'} | Wave: ${gameState.wave}`;
      document.getElementById('waveText').textContent = `Wave ${gameState.wave}${gameState.wave % 10 === 0 ? ' - BOSS' : ''}`;

      const abilityContainer = document.getElementById('abilityList');
      abilityContainer.innerHTML = '';
      p.abilities.forEach(ability => {
        const btn = document.createElement('button');
        btn.className = 'ability-btn';
        const now = performance.now() / 1000;
        const canUse = p.power >= ability.cost && (!ability.lastCast || now - ability.lastCast >= ability.cooldown);
        if (ability.lastCast && now - ability.lastCast < ability.cooldown) {
          btn.classList.add('cooldown');
          const remaining = (ability.cooldown - (now - ability.lastCast)).toFixed(1);
          btn.textContent = `${ability.name} (${remaining}s)`;
        } else {
          btn.textContent = `${ability.name}`;
        }
        btn.innerHTML += `<span class="key-badge">${ability.key}</span>`;
        abilityContainer.appendChild(btn);
      });
    }

    function renderGame() {
      const p = gameState.player;

      // Background
      ctx.fillStyle = '#0d1620';
      ctx.fillRect(0, 0, W, H);

      // Grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      if (!p) return;

      // Draw enemies
      gameState.enemies.forEach(enemy => {
        ctx.fillStyle = enemy.hitFlash > 0 ? '#ffff88' : enemy.color;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI * 2);
        ctx.fill();

        // HP bar
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(enemy.x - 18, enemy.y - 26, 36, 5);
        ctx.fillStyle = '#52ef7d';
        ctx.fillRect(enemy.x - 18, enemy.y - 26, 36 * (enemy.hp / enemy.maxHp), 5);
      });

      // Draw projectiles
      gameState.projectiles.forEach(proj => {
        ctx.fillStyle = proj.owner === 'player' ? '#7fd3ff' : '#ffa500';
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw player
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.direction);

      if (p.standActive) {
        ctx.shadowColor = stands[p.standName].color;
        ctx.shadowBlur = 15;
      }

      ctx.fillStyle = p.standActive ? stands[p.standName].color : '#f0f0f0';
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.arc(4, -2, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#52ef7d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(p.r + 14, 0);
      ctx.stroke();

      ctx.restore();

      // Player HP bar
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(p.x - 20, p.y - 28, 40, 5);
      ctx.fillStyle = '#52ef7d';
      ctx.fillRect(p.x - 20, p.y - 28, 40 * (Math.max(0, p.hp) / p.maxHp), 5);

      // Draw particles
      gameState.particles.forEach(part => {
        ctx.globalAlpha = Math.max(0, part.life / 0.6);
        if (part.text) {
          ctx.fillStyle = part.color;
          ctx.font = '700 16px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(part.text, part.x, part.y);
        }
        ctx.globalAlpha = 1;
      });

      // Game Over screen
      if (!gameState.running) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Battle Lost', W / 2, H / 2 - 20);
        ctx.font = '20px Arial';
        ctx.fillText(`Wave: ${gameState.wave} | Score: ${gameState.score}`, W / 2, H / 2 + 20);
        ctx.fillText('Press R to retry', W / 2, H / 2 + 60);
      }
    }

    function castAbility(ability) {
      const p = gameState.player;
      if (!p.standActive || p.power < ability.cost) return;

      const now = performance.now() / 1000;
      if (ability.lastCast && now - ability.lastCast < ability.cooldown) return;

      ability.lastCast = now;
      p.power -= ability.cost;

      const angle = p.direction || 0;
      const cx = p.x + Math.cos(angle) * 35;
      const cy = p.y + Math.sin(angle) * 35;

      if (ability.type === 'barrage' || ability.type === 'melee') {
        gameState.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (d < 80) {
            enemy.hp -= ability.damage * p.damageMultiplier;
            gameState.particles.push({
              x: enemy.x, y: enemy.y,
              text: `-${Math.round(ability.damage * p.damageMultiplier)}`,
              life: 0.6,
              color: '#ff7688'
            });
            if (enemy.hp <= 0) {
              gameState.enemies.splice(gameState.enemies.indexOf(enemy), 1);
              gameState.score += 10;
              p.power = Math.min(p.maxPower, p.power + 15);
            }
          }
        });
      }

      if (ability.type === 'projectile') {
        gameState.projectiles.push({
          x: cx, y: cy,
          angle: angle,
          speed: 6,
          damage: ability.damage * p.damageMultiplier,
          owner: 'player'
        });
      }

      if (ability.type === 'slash') {
        gameState.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (d < 100) {
            enemy.hp -= ability.damage * p.damageMultiplier;
            gameState.particles.push({
              x: enemy.x, y: enemy.y,
              text: `-${Math.round(ability.damage * p.damageMultiplier)}`,
              life: 0.6,
              color: '#ff7688'
            });
            if (enemy.hp <= 0) {
              gameState.enemies.splice(gameState.enemies.indexOf(enemy), 1);
              gameState.score += 10;
              p.power = Math.min(p.maxPower, p.power + 15);
            }
          }
        });
      }

      if (ability.type === 'aoe') {
        gameState.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - p.x, enemy.y - p.y);
          if (d < 140) {
            enemy.hp -= ability.damage * p.damageMultiplier;
            gameState.particles.push({
              x: enemy.x, y: enemy.y,
              text: `-${Math.round(ability.damage * p.damageMultiplier)}`,
              life: 0.6,
              color: '#ff7688'
            });
            if (enemy.hp <= 0) {
              gameState.enemies.splice(gameState.enemies.indexOf(enemy), 1);
              gameState.score += 10;
              p.power = Math.min(p.maxPower, p.power + 15);
            }
          }
        });
      }

      if (ability.type === 'dash') {
        p.x += Math.cos(angle) * 60;
        p.y += Math.sin(angle) * 60;
        p.x = Math.max(20, Math.min(W - 20, p.x));
        p.y = Math.max(20, Math.min(H - 20, p.y));
      }

      if (ability.type === 'timestop') {
        gameState.timeStopTimer = 1.5;
      }

      if (ability.type === 'ultimate') {
        gameState.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - p.x, enemy.y - p.y);
          if (d < 200) {
            enemy.hp -= ability.damage * p.damageMultiplier;
            gameState.particles.push({
              x: enemy.x, y: enemy.y,
              text: `-${Math.round(ability.damage * p.damageMultiplier)}`,
              life: 0.6,
              color: '#ff7688'
            });
            if (enemy.hp <= 0) {
              gameState.enemies.splice(gameState.enemies.indexOf(enemy), 1);
              gameState.score += 10;
              p.power = Math.min(p.maxPower, p.power + 15);
            }
          }
        });
      }
    }

    document.addEventListener('keydown', (e) => {
      input.keys[e.key] = true;

      if (gameState.mode === 'game') {
        if (e.key.toLowerCase() === 'q') {
          gameState.player.standActive = !gameState.player.standActive;
        }

        if (e.key.toLowerCase() === 'r' && !gameState.running) {
          document.getElementById('menuOverlay').classList.remove('hidden');
          gameState.mode = 'menu';
        }

        const ability = gameState.player.abilities.find(a => a.key.toLowerCase() === e.key.toLowerCase());
        if (ability) {
          castAbility(ability);
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      input.keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      input.mouse.x = e.clientX - rect.left;
      input.mouse.y = e.clientY - rect.top;

      if (gameState.player) {
        gameState.player.direction = Math.atan2(
          input.mouse.y - gameState.player.y,
          input.mouse.x - gameState.player.x
        );
      }
    });

    canvas.addEventListener('click', () => {
      if (gameState.running && gameState.player && gameState.player.standActive) {
        const p = gameState.player;
        gameState.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - p.x, enemy.y - p.y);
          if (d < 70) {
            enemy.hp -= 12 * p.damageMultiplier;
            gameState.particles.push({
              x: enemy.x, y: enemy.y,
              text: `-${Math.round(12 * p.damageMultiplier)}`,
              life: 0.6,
              color: '#ff7688'
            });
            if (enemy.hp <= 0) {
              gameState.enemies.splice(gameState.enemies.indexOf(enemy), 1);
              gameState.score += 10;
              p.power = Math.min(p.maxPower, p.power + 15);
            }
          }
        });
      }
    });

    let lastFrame = performance.now();
    function gameLoop() {
      const now = performance.now();
      const deltaTime = Math.min((now - lastFrame) / 1000, 0.033);
      lastFrame = now;

      if (gameState.running && gameState.mode === 'game') {
        updateGame(deltaTime);
      }

      renderGame();
      requestAnimationFrame(gameLoop);
    }

    initMenu();
    gameLoop();
  </script>
</body>
</html>
