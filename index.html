<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoJo Stand Wave Battle</title>
  <style>
    :root {
      --bg1: #0c0b13;
      --bg2: #18132a;
      --panel: rgba(17, 18, 28, 0.9);
      --panel2: rgba(26, 28, 40, 0.9);
      --gold: #f5d77b;
      --pink: #ff67d7;
      --red: #ff4d5a;
      --green: #69f09a;
      --cyan: #83d7ff;
      --violet: #9b7dff;
      --cream: #f4ebff;
      --dark: #11131d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: radial-gradient(circle at top, #2a1d40, #0a0a11 55%);
      color: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .app {
      display: flex;
      gap: 18px;
      align-items: stretch;
      max-width: 1500px;
      width: 100%;
      justify-content: center;
    }

    .hud {
      width: 360px;
      background: var(--panel);
      border-radius: 14px;
      border: 2px solid rgba(245, 215, 123, 0.65);
      box-shadow: 0 0 25px rgba(245, 215, 123, 0.12), inset 0 0 16px rgba(255,255,255,0.04);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 12px;
    }

    .title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stand-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--pink);
      margin-bottom: 4px;
      text-shadow: 0 0 18px rgba(255, 103, 215, 0.5);
    }

    .stand-desc {
      font-size: 12px;
      line-height: 1.5;
      color: #ede5ff;
      opacity: 0.9;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin: 6px 0 4px;
      color: #f5f0ff;
    }

    .stat-val {
      font-weight: 700;
      color: var(--green);
    }

    .bar {
      height: 14px;
      width: 100%;
      border-radius: 7px;
      overflow: hidden;
      background: rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 8px;
      position: relative;
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      transition: width 0.12s linear;
    }

    .fill.hp { background: linear-gradient(90deg,#42e68b,#88f090); }
    .fill.st { background: linear-gradient(90deg,#ff9d2c,#ffd165); }
    .fill.pow { background: linear-gradient(90deg,#ff5bd7,#b965ff); }

    .ability-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .ability {
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border: 1px solid rgba(245, 215, 123, 0.7);
      background: rgba(245, 215, 123, 0.05);
      color: #fbeec9;
      cursor: pointer;
      transition: 0.15s ease;
      user-select: none;
    }

    .ability:hover {
      transform: translateX(2px);
      border-color: rgba(245, 215, 123, 1);
      background: rgba(245, 215, 123, 0.12);
    }

    .ability.ready {
      box-shadow: inset 0 0 12px rgba(105, 240, 154, 0.12);
    }

    .ability.cooldown {
      opacity: 0.55;
      filter: grayscale(0.2);
    }

    .ability-name {
      font-weight: 700;
      font-size: 12px;
    }

    .ability-meta {
      font-size: 10px;
      opacity: 0.8;
      color: #e4dfff;
    }

    .keycap {
      display: inline-flex;
      min-width: 22px;
      justify-content: center;
      padding: 2px 5px;
      background: rgba(105, 240, 154, 0.12);
      border: 1px solid rgba(105, 240, 154, 0.7);
      border-radius: 5px;
      color: #aaf5c5;
      font-weight: 700;
      font-size: 11px;
    }

    .controls {
      font-size: 12px;
      line-height: 1.7;
      color: #f1e7ff;
    }

    .kbd {
      display: inline-block;
      min-width: 18px;
      text-align: center;
      padding: 1px 6px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: white;
      font-weight: 700;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.14);
    }

    .game-wrap {
      position: relative;
      width: 980px;
      height: 640px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(245, 215, 123, 0.7);
      background: #0a1020;
      box-shadow: 0 0 36px rgba(0,0,0,0.35), inset 0 0 18px rgba(0,0,0,0.2);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg,#0d1f2e,#071820);
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .banner {
      position: absolute;
      top: 18px;
      left: 20px;
      background: rgba(16, 18, 29, 0.76);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 0 18px rgba(0,0,0,0.25);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
    }

    .float {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(16, 18, 29, 0.7);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #f0ebff;
      box-shadow: 0 0 18px rgba(0,0,0,0.25);
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 7px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(105, 240, 154, 0.12);
      border: 1px solid rgba(105, 240, 154, 0.65);
      color: #adfbc8;
      margin-right: 8px;
    }

    .dialog {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 19, 29, 0.93);
      border: 2px solid rgba(245, 215, 123, 0.7);
      width: 620px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.32);
      z-index: 12;
    }

    .dialog h2 {
      margin: 0 0 8px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 22px;
    }

    .stand-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .stand-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .stand-card:hover {
      border-color: rgba(245, 215, 123, 0.8);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.2);
    }

    .stand-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 18px rgba(245, 215, 123, 0.2);
      background: rgba(245, 215, 123, 0.08);
    }

    .stand-card h3 {
      margin: 0 0 8px;
      font-size: 17px;
      color: #f7ebff;
    }

    .stand-card p {
      color: #e6d9ff;
      font-size: 12px;
      line-height: 1.5;
      margin: 0;
    }

    .start-btn {
      display: inline-block;
      margin-top: 18px;
      background: linear-gradient(180deg,#f6d36d,#e0b454);
      color: #1d1302;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(245, 215, 123, 0.18);
    }

    .start-btn:hover {
      filter: brightness(1.05);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="game-wrap">
      <canvas id="game"></canvas>
      <div class="overlay">
        <div class="banner" id="banner">Wave 1</div>
        <div class="float" id="floatInfo"><span class="badge">Stand</span><span id="standStatus">Stand Dormant</span></div>
      </div>

      <div id="menuDialog" class="dialog">
        <h2>Select Stand</h2>
        <div class="stand-grid" id="standGrid"></div>
        <button class="start-btn" id="startBtn">Start Battle</button>
      </div>
    </div>

    <div class="hud">
      <div class="panel">
        <div class="title">Stand</div>
        <div id="standName" class="stand-name">The World</div>
        <div id="standDesc" class="stand-desc">Time control. The user can change the flow of the world.</div>
      </div>

      <div class="panel">
        <div class="title">Status</div>
        <div class="stat-row"><span>Health</span><span class="stat-val" id="hpText">100 / 100</span></div>
        <div class="bar"><div id="hpBar" class="fill hp"></div></div>

        <div class="stat-row"><span>Stamina</span><span class="stat-val" id="stText">100 / 100</span></div>
        <div class="bar"><div id="stBar" class="fill st"></div></div>

        <div class="stat-row"><span>Stand Power</span><span class="stat-val" id="powText">100 / 100</span></div>
        <div class="bar"><div id="powBar" class="fill pow"></div></div>
      </div>

      <div class="panel">
        <div class="title">Abilities</div>
        <div id="abilityList" class="ability-list"></div>
      </div>

      <div class="panel">
        <div class="title">Controls</div>
        <div class="controls">
          <div><span class="kbd">WASD</span> Move</div>
          <div><span class="kbd">Q</span> Stand toggle</div>
          <div><span class="kbd">LMB</span> M1 melee</div>
          <div><span class="kbd">E-R-T-G-V-C-X-Z</span> Abilities</div>
          <div><span class="kbd">Click</span> Bind keys</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = 980, H = 640;
    canvas.width = W; canvas.height = H;

    const game = {
      mode: 'menu',
      wave: 1,
      score: 0,
      bossWave: 10,
      nextWaveDelay: 0,
      freezeTimer: 0,
      timeStopActive: false,
      message: '',
      lastTs: 0,
      over: false,
      casts: [],
      particles: [],
      projectiles: [],
      enemies: [],
      buffs: [],
      player: null,
      selectedStand: null,
      bindMode: null
    };

    const keys = {};
    const mouse = { x: W / 2, y: H / 2, down: false };
    const standDefs = {
      'The World': {
        name: 'The World',
        type: 'time',
        color: '#c59eff',
        accent: '#ffe483',
        description: 'Time control. The user can freeze the world and unleash devastating barrages.',
        stats: { speed: 1.0, power: 1.0, damage: 1.0 },
        abilities: [
          { id: 'tw_barrage', key: 'E', name: 'Barrage', kind: 'melee', cost: 8, cooldown: 0.35, damage: 12, radius: 76 },
          { id: 'tw_knife', key: 'R', name: 'Knife Throw', kind: 'projectile', cost: 13, cooldown: 1.1, damage: 22, radius: 36, speed: 8 },
          { id: 'tw_punch', key: 'T', name: 'Heavy Punch', kind: 'melee', cost: 18, cooldown: 1.3, damage: 32, radius: 90 },
          { id: 'tw_stop', key: 'G', name: 'Time Stop', kind: 'time', cost: 35, cooldown: 12, damage: 0, radius: 0 },
          { id: 'tw_slash', key: 'V', name: 'World Slash', kind: 'slash', cost: 20, cooldown: 1.8, damage: 28, radius: 128 },
          { id: 'tw_road', key: 'C', name: 'Road Roller', kind: 'burst', cost: 24, cooldown: 2.3, damage: 30, radius: 140 },
          { id: 'tw_fury', key: 'X', name: 'Instant Dying', kind: 'dash', cost: 24, cooldown: 4, damage: 40, radius: 150 },
          { id: 'tw_ultimate', key: 'Z', name: 'Za Warudo!', kind: 'ultimate', cost: 55, cooldown: 15, damage: 70, radius: 220 }
        ]
      },
      'Silver Chariot': {
        name: 'Silver Chariot',
        type: 'speed',
        color: '#d9e8ff',
        accent: '#f2ff9d',
        description: 'An elite close-quarters swordsman with elegant, rapid slashes and armor bursts.',
        stats: { speed: 1.15, power: 1.08, damage: 1.1 },
        abilities: [
          { id: 'sc_fast', key: 'E', name: 'Fast Thrust', kind: 'melee', cost: 9, cooldown: 0.3, damage: 12, radius: 72 },
          { id: 'sc_arc', key: 'R', name: 'Silver Arc', kind: 'slash', cost: 15, cooldown: 1.1, damage: 24, radius: 120 },
          { id: 'sc_charge', key: 'T', name: 'Armor Charge', kind: 'dash', cost: 16, cooldown: 2.3, damage: 22, radius: 110 },
          { id: 'sc_pierce', key: 'G', name: 'Piercing Lunge', kind: 'projectile', cost: 20, cooldown: 1.8, damage: 30, radius: 50, speed: 9 },
          { id: 'sc_swordrain', key: 'V', name: 'Sword Rain', kind: 'burst', cost: 24, cooldown: 2.8, damage: 34, radius: 150 },
          { id: 'sc_armor', key: 'C', name: 'Armor Break', kind: 'melee', cost: 24, cooldown: 2.4, damage: 36, radius: 100 },
          { id: 'sc_ultima', key: 'X', name: 'Annihilation Slash', kind:'slash', cost: 28, cooldown: 4.5, damage: 46, radius: 170 },
          { id: 'sc_final', key: 'Z', name: 'Golden Rush', kind:'ultimate', cost: 56, cooldown: 16, damage: 80, radius: 230 }
        ]
      },
      "Magician's Red": {
        name: "Magician's Red",
        type: 'fire',
        color: '#ff7a45',
        accent: '#ffdc70',
        description: 'A flaming stand with relentless fire pressure, sweeping burns, and heat-wave attacks.',
        stats: { speed: 0.98, power: 1.2, damage: 1.15 },
        abilities: [
          { id: 'mr_burn', key: 'E', name: 'Flame Punch', kind: 'melee', cost: 10, cooldown: 0.5, damage: 13, radius: 80 },
          { id: 'mr_fireball', key: 'R', name: 'Fireball', kind: 'projectile', cost: 14, cooldown: 1.1, damage: 20, radius: 34, speed: 7 },
          { id: 'mr_wave', key: 'T', name: 'Heat Wave', kind: 'slash', cost: 18, cooldown: 1.5, damage: 28, radius: 130 },
          { id: 'mr_meteor', key: 'G', name: 'Meteor Burst', kind: 'burst', cost: 24, cooldown: 2.4, damage: 34, radius: 165 },
          { id: 'mr_floor', key: 'V', name: 'Fire Floor', kind: 'aoe', cost: 26, cooldown: 2.3, damage: 32, radius: 140 },
          { id: 'mr_phoenix', key: 'C', name: 'Phoenix Rush', kind: 'dash', cost: 20, cooldown: 3.6, damage: 38, radius: 150 },
          { id: 'mr_fourth', key: 'X', name: 'Pyro Storm', kind: 'burst', cost: 28, cooldown: 4.8, damage: 48, radius: 180 },
          { id: 'mr_ultimate', key: 'Z', name: 'Inferno', kind:'ultimate', cost: 58, cooldown: 17, damage: 85, radius: 235 }
        ]
      },
      'D4C': {
        name: 'D4C',
        type: 'dimensional',
        color: '#7bd3ff',
        accent: '#f9f1fb',
        description: 'Dimensional movement and clone-based attacks. Unpredictable and highly evasive.',
        stats: { speed: 1.25, power: 1.05, damage: 1.1 },
        abilities: [
          { id: 'd4c_slice', key: 'E', name: 'Dimension Cut', kind: 'melee', cost: 9, cooldown: 0.42, damage: 14, radius: 82 },
          { id: 'd4c_clone', key: 'R', name: 'Clone Rush', kind: 'dash', cost: 16, cooldown: 1.1, damage: 20, radius: 140 },
          { id: 'd4c_bolt', key: 'T', name: 'Portal Bolt', kind: 'projectile', cost: 18, cooldown: 1.2, damage: 26, radius: 40, speed: 8 },
          { id: 'd4c_swap', key: 'G', name: 'Dimension Swap', kind: 'blink', cost: 18, cooldown: 3.5, damage: 0, radius: 0 },
          { id: 'd4c_wave', key: 'V', name: 'Reality Ripple', kind: 'slash', cost: 19, cooldown: 1.6, damage: 28, radius: 120 },
          { id: 'd4c_sphere', key: 'C', name: 'Gap Sphere', kind: 'burst', cost: 22, cooldown: 2.7, damage: 32, radius: 150 },
          { id: 'd4c_portal', key: 'X', name: 'Portal Stream', kind: 'projectile', cost: 28, cooldown: 4.4, damage: 44, radius: 52, speed: 9 },
          { id: 'd4c_ultimate', key: 'Z', name: 'World Break', kind:'ultimate', cost: 58, cooldown: 16, damage: 88, radius: 250 }
        ]
      }
    };

    function initStandSelection() {
      const grid = document.getElementById('standGrid');
      grid.innerHTML = '';
      const entries = Object.keys(standDefs);
      entries.forEach(name => {
        const card = document.createElement('div');
        card.className = 'stand-card';
        if (name === 'The World') card.classList.add('selected');
        card.innerHTML = `
          <h3>${name}</h3>
          <p>${standDefs[name].description}</p>
        `;
        card.addEventListener('click', () => {
          document.querySelectorAll('.stand-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          game.selectedStand = name;
        });
        grid.appendChild(card);
      });
      game.selectedStand = 'The World';
    }

    function activateMenu() {
      document.getElementById('menuDialog').classList.remove('hidden');
      game.mode = 'menu';
      game.over = false;
    }

    function startGame() {
      document.getElementById('menuDialog').classList.add('hidden');
      game.mode = 'game';
      game.wave = 1;
      game.score = 0;
      game.message = '';
      game.over = false;
      game.buffs = [];
      game.lastTs = performance.now();

      const standName = game.selectedStand || 'The World';
      game.player = {
        x: W / 2,
        y: H / 2,
        r: 16,
        speed: 2.5,
        hp: 100,
        maxHp: 100,
        stamina: 100,
        maxStamina: 100,
        power: 100,
        maxPower: 100,
        direction: 0,
        standOn: false,
        invuln: 0,
        damageMult: 1,
        attackFlash: 0,
        standName,
        abilityMap: [],
        m1Cooldown: 0,
        dashTimer: 0,
        tpReady: true
      };

      const def = standDefs[standName];
      game.player.speed *= def.stats.speed;
      game.player.damageMult = def.stats.damage;
      game.player.abilityMap = def.abilities.map(a => ({ ...a }));
      renderStandInfo();
      renderAbilityList();
      spawnWave();
    }

    function resetGame() {
      game.particles = [];
      game.projectiles = [];
      game.enemies = [];
      game.wave = 1;
      game.score = 0;
      game.nextWaveDelay = 0;
      game.freezeTimer = 0;
      game.timeStopActive = false;
      startGame();
    }

    function renderStandInfo() {
      const stand = standDefs[game.player.standName];
      if (!stand) return;
      document.getElementById('standName').textContent = stand.name;
      document.getElementById('standDesc').textContent = stand.description;
      document.getElementById('standStatus').textContent = game.player.standOn ? 'Stand Active' : 'Stand Dormant';
    }

    function renderAbilityList() {
      const list = document.getElementById('abilityList');
      list.innerHTML = '';
      const stand = standDefs[game.player.standName];
      if (!stand) return;

      stand.abilities.forEach((ability) => {
        const div = document.createElement('div');
        div.className = 'ability ready';
        div.innerHTML = `
          <span>
            <span class="ability-name">${ability.name}</span><br>
            <span class="ability-meta">${ability.cost} power</span>
          </span>
          <span class="keycap">${ability.key}</span>
        `;
        div.addEventListener('click', () => {
          game.bindMode = ability.id;
          div.style.borderColor = '#ff67d7';
          div.style.background = 'rgba(255,103,215,0.08)';
          div.innerHTML = `<span class="ability-name">Press a key...</span><span class="keycap">?</span>`;
        });
        list.appendChild(div);
      });
    }

    function updateHud() {
      if (!game.player) return;
      const p = game.player;
      const hp = Math.max(0, p.hp);
      const st = Math.max(0, p.stamina);
      const pow = Math.max(0, p.power);

      document.getElementById('hpText').textContent = `${Math.ceil(hp)} / ${p.maxHp}`;
      document.getElementById('stText').textContent = `${Math.ceil(st)} / ${p.maxStamina}`;
      document.getElementById('powText').textContent = `${Math.ceil(pow)} / ${p.maxPower}`;
      document.getElementById('hpBar').style.width = `${(hp / p.maxHp) * 100}%`;
      document.getElementById('stBar').style.width = `${(st / p.maxStamina) * 100}%`;
      document.getElementById('powBar').style.width = `${(pow / p.maxPower) * 100}%`;
      document.getElementById('banner').textContent = `Wave ${game.wave}` + (game.wave % 10 === 0 ? ' • BOSS' : '');
      document.getElementById('standStatus').textContent = p.standOn ? 'Stand Active' : 'Stand Dormant';

      const abilityButtons = document.querySelectorAll('.ability');
      const stand = standDefs[p.standName];
      stand.abilities.forEach((ability, idx) => {
        const btn = abilityButtons[idx];
        if (!btn) return;
        const now = performance.now() / 1000;
        const cd = ability.cooldownLeft || 0;
        const onCooldown = now < cd;
        const ready = !onCooldown && p.power >= ability.cost && p.standOn;
        btn.classList.toggle('ready', ready);
        btn.classList.toggle('cooldown', onCooldown || p.power < ability.cost);
        const remaining = onCooldown ? Math.max(0, cd - now).toFixed(1) : null;
        btn.innerHTML = `
          <span>
            <span class="ability-name">${ability.name}</span><br>
            <span class="ability-meta">${remaining ? `${remaining}s` : `${ability.cost} power`}</span>
          </span>
          <span class="keycap">${ability.key}</span>
        `;
      });
    }

    function toggleStand() {
      if (!game.player || game.mode !== 'game') return;
      game.player.standOn = !game.player.standOn;
      renderStandInfo();
      if (game.player.standOn) {
        createBurst(game.player.x, game.player.y, standDefs[game.player.standName].color, 20, 1.4);
      }
    }

    function makeProjectile(x, y, angle, speed, damage, color, owner) {
      game.projectiles.push({ x, y, angle, speed, damage, color, owner, radius: 5, life: 1.5 });
    }

    function createBurst(x, y, color, amount, life = 1) {
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 2.4 + 0.8);
        game.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 2 + Math.random() * 4,
          color,
          life: life * (0.5 + Math.random() * 0.8),
          maxLife: life,
          kind: 'spark'
        });
      }
    }

    function impactText(x, y, text, color = '#fff') {
      game.particles.push({ x, y, text, color, life: 0.7, maxLife: 0.7, kind: 'text', vy: -0.6, vx: 0, r: 18 });
    }

    function damageEnemy(enemy, amount, x, y) {
      enemy.hp -= amount;
      impactText(x, y, `-${Math.ceil(amount)}`, '#ff7688');
      enemy.hitFlash = 0.18;
      if (enemy.hp <= 0) {
        game.score += enemy.value || 10;
        createBurst(enemy.x, enemy.y, enemy.color, 18, 0.9);
        // remove enemy
        const index = game.enemies.indexOf(enemy);
        if (index >= 0) game.enemies.splice(index, 1);
        game.player.power = Math.min(game.player.maxPower, game.player.power + 12);
        if (enemy.type === 'boss') {
          onBossDefeat();
        }
      }
    }

    function onBossDefeat() {
      const rank = Math.floor(game.wave / 10);
      game.buffs.push({ type: 'damage', amount: 0.12 + rank * 0.03, ttl: 9999 });
      game.buffs.push({ type: 'time', amount: 0.35 + rank * 0.12, ttl: 9999 });
      const p = game.player;
      p.damageMult *= 1.15;
      p.maxHp += 15;
      p.hp = p.maxHp;
      game.message = 'Boss slain! Buffs applied.';
    }

    function getStandAbilityByKey(key) {
      const stand = standDefs[game.player.standName];
      return stand.abilities.find(a => a.key.toLowerCase() === key.toLowerCase());
    }

    function castAbility(ability) {
      if (!game.player || !game.player.standOn) return;
      if (game.player.power < ability.cost) return;
      const now = performance.now() / 1000;
      if ((ability.cooldownLeft || 0) > now) return;
      ability.cooldownLeft = now + ability.cooldown;
      game.player.power -= ability.cost;

      const p = game.player;
      const angle = p.direction || 0;
      const cx = p.x + Math.cos(angle) * 42;
      const cy = p.y + Math.sin(angle) * 42;

      if (ability.kind === 'melee') {
        const hitRange = ability.radius;
        game.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (d <= hitRange + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMult, enemy.x, enemy.y);
          }
        });
        createBurst(cx, cy, standDefs[p.standName].accent, 16, 0.7);
        p.attackFlash = 0.25;
      }

      if (ability.kind === 'slash') {
        const angs = 22;
        for (let i = 0; i < angs; i++) {
          const a = angle + (i / angs - 0.5) * 2.3;
          const sx = cx + Math.cos(a) * ability.radius * 0.7;
          const sy = cy + Math.sin(a) * ability.radius * 0.7;
          game.particles.push({ x: sx, y: sy, r: 3, color: standDefs[p.standName].accent, life: 0.5, maxLife: 0.5, vx: Math.cos(a)*2, vy: Math.sin(a)*2, kind: 'spark' });
        }
        game.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (d <= ability.radius + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMult, enemy.x, enemy.y);
          }
        });
      }

      if (ability.kind === 'projectile') {
        makeProjectile(cx, cy, angle, ability.speed || 7.5, ability.damage * p.damageMult, standDefs[p.standName].color, 'player');
      }

      if (ability.kind === 'burst') {
        for (let i = 0; i < 18; i++) {
          const a = angle + (Math.random() - 0.5) * 1.8;
          const dist = 25 + Math.random() * ability.radius * 0.8;
          const px = cx + Math.cos(a) * dist;
          const py = cy + Math.sin(a) * dist;
          game.particles.push({ x: px, y: py, r: 3, color: standDefs[p.standName].color, life: 0.8, maxLife: 0.8, vx: Math.cos(a) * 1.8, vy: Math.sin(a) * 1.8, kind: 'spark' });
        }
        game.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (d <= ability.radius + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMult, enemy.x, enemy.y);
          }
        });
      }

      if (ability.kind === 'dash') {
        const dashDist = 55;
        p.x = clamp(p.x + Math.cos(angle) * dashDist, 20, W - 20);
        p.y = clamp(p.y + Math.sin(angle) * dashDist, 20, H - 20);
        for (let i = 0; i < 22; i++) {
          game.particles.push({ x:p.x,y:p.y,r:2+Math.random()*3,color:standDefs[p.standName].accent,life:0.5,maxLife:0.5,vx:(Math.random()-0.5)*2.4,vy:(Math.random()-0.5)*2.4,kind:'spark' });
        }
        game.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - p.x, enemy.y - p.y);
          if (d <= ability.radius + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMult, enemy.x, enemy.y);
          }
        });
      }

      if (ability.kind === 'aoe') {
        game.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (d <= ability.radius + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMult, enemy.x, enemy.y);
          }
        });
        createBurst(cx, cy, standDefs[p.standName].color, 28, 1.2);
      }

      if (ability.kind === 'time') {
        if (ability.name === 'Time Stop') {
          game.freezeTimer = 1.6 + (game.wave / 15);
          game.timeStopActive = true;
          createBurst(p.x, p.y, '#ffd56c', 30, 1.2);
        }
      }

      if (ability.kind === 'blink') {
        p.x = clamp(p.x + Math.cos(angle) * 110, 20, W - 20);
        p.y = clamp(p.y + Math.sin(angle) * 110, 20, H - 20);
        createBurst(p.x, p.y, standDefs[p.standName].color, 20, 1.2);
      }

      if (ability.kind === 'ultimate') {
        game.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (d <= ability.radius + enemy.r) {
            damageEnemy(enemy, ability.damage * p.damageMult, enemy.x, enemy.y);
          }
        });
        createBurst(cx, cy, standDefs[p.standName].accent, 45, 1.4);
      }
    }

    function performM1() {
      if (!game.player || game.mode !== 'game') return;
      const now = performance.now() / 1000;
      if (game.player.m1Cooldown > now) return;
      game.player.m1Cooldown = now + 0.25;
      const p = game.player;
      const angle = p.direction || 0;
      const cx = p.x + Math.cos(angle) * 36;
      const cy = p.y + Math.sin(angle) * 36;
      if (p.standOn) {
        const stand = standDefs[p.standName];
        createBurst(cx, cy, stand.accent, 14, 0.6);
        game.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - cx, enemy.y - cy);
          if (d <= 72 + enemy.r) {
            damageEnemy(enemy, 15 * p.damageMult, enemy.x, enemy.y);
          }
        });
      } else {
        game.enemies.forEach(enemy => {
          const d = Math.hypot(enemy.x - p.x, enemy.y - p.y);
          if (d <= 58 + enemy.r) {
            damageEnemy(enemy, 11 * p.damageMult, enemy.x, enemy.y);
          }
        });
      }
    }

    function spawnWave() {
      const count = 6 + game.wave * 2;
      const bossWave = game.wave % 10 === 0;
      game.enemies = [];
      for (let i = 0; i < count; i++) {
        const side = Math.floor(Math.random() * 4);
        let x = 0, y = 0;
        if (side === 0) { x = Math.random() * W; y = -30; }
        if (side === 1) { x = W + 30; y = Math.random() * H; }
        if (side === 2) { x = Math.random() * W; y = H + 30; }
        if (side === 3) { x = -30; y = Math.random() * H; }

        const enemy = {
          x, y,
          r: bossWave ? 28 : 18,
          hp: bossWave ? 220 + game.wave * 18 : 24 + game.wave * 3,
          maxHp: bossWave ? 220 + game.wave * 18 : 24 + game.wave * 3,
          speed: bossWave ? 0.9 + game.wave * 0.04 : 0.8 + Math.random() * 1.5,
          color: bossWave ? '#ff5555' : '#52ef7d',
          value: bossWave ? 80 : 12,
          type: bossWave ? 'boss' : ['runner','shooter','melee','tank'][Math.floor(Math.random()*4)],
          shotCooldown: 1.5 + Math.random() * 1.5,
          hitFlash: 0,
          gun: ['pistol','scatter','flame','needle'][Math.floor(Math.random()*4)]
        };
        game.enemies.push(enemy);
      }
      if (bossWave) {
        const boss = game.enemies[0];
        boss.type = 'boss';
        boss.r = 34;
        boss.hp = 420 + game.wave * 30;
        boss.maxHp = boss.hp;
        boss.speed = 0.8 + game.wave * 0.04;
        boss.color = '#ff5757';
        boss.value = 160;
      }
    }

    function updatePlayer(dt) {
      const p = game.player;
      if (!p) return;
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (dx || dy) {
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        p.x += dx * p.speed * 60 * dt;
        p.y += dy * p.speed * 60 * dt;
        p.direction = Math.atan2(dy, dx);
      }

      p.x = clamp(p.x, 18, W - 18);
      p.y = clamp(p.y, 18, H - 18);
      p.stamina = Math.min(p.maxStamina, p.stamina + 20 * dt);
      p.power = Math.min(p.maxPower, p.power + 4 * dt);
      p.invuln = Math.max(0, p.invuln - dt);
      p.attackFlash = Math.max(0, p.attackFlash - dt * 1.8);

      const stand = standDefs[p.standName];
      if (p.standOn) {
        p.x += 0;
      }

      // Passive power buffs from boss kills
      for (let i = game.buffs.length - 1; i >= 0; i--) {
        game.buffs[i].ttl -= dt;
        if (game.buffs[i].ttl <= 0) game.buffs.splice(i, 1);
      }

      // if time stop active, freeze enemies and projectiles temporarily
      if (game.timeStopActive) {
        game.freezeTimer -= dt;
        if (game.freezeTimer <= 0) {
          game.timeStopActive = false;
          game.freezeTimer = 0;
        }
      }
    }

    function updateEnemies(dt) {
      if (!game.enemies.length) return;
      const p = game.player;
      for (let i = game.enemies.length - 1; i >= 0; i--) {
        const e = game.enemies[i];
        if (game.timeStopActive) continue;
        e.hitFlash = Math.max(0, e.hitFlash - dt * 2.2);

        const dx = p.x - e.x;
        const dy = p.y - e.y;
        const dist = Math.hypot(dx, dy) || 1;

        const close = dist < 160 ? 0.8 : 1;
        e.x += (dx / dist) * e.speed * 60 * dt * close;
        e.y += (dy / dist) * e.speed * 60 * dt * close;

        if (e.type === 'shooter' || e.type === 'boss') {
          e.shotCooldown -= dt;
          if (e.shotCooldown <= 0) {
            e.shotCooldown = e.type === 'boss' ? 0.8 : 1.3 + Math.random() * 1.2;
            let angle = Math.atan2(p.y - e.y, p.x - e.x);
            const projSpeed = e.type === 'boss' ? 5.8 : 4.2;
            game.projectiles.push({
              x: e.x, y: e.y, angle, speed: projSpeed, damage: e.type === 'boss' ? 12 : 8,
              color: e.type === 'boss' ? '#ff8f7f' : '#ffc66d', owner: 'enemy', radius: e.type === 'boss' ? 7 : 5, life: 3
            });
          }
        }

        if (dist < p.r + e.r + 8 && p.invuln <= 0) {
          p.hp -= e.type === 'boss' ? 14 : 8;
          p.invuln = 0.7;
          impactText(p.x, p.y, `-${e.type === 'boss' ? 14 : 8}`, '#ff7f8a');
          if (p.hp <= 0) {
            game.over = true;
          }
        }
      }
    }

    function updateProjectiles(dt) {
      for (let i = game.projectiles.length - 1; i >= 0; i--) {
        const p = game.projectiles[i];
        if (game.timeStopActive) continue;
        p.x += Math.cos(p.angle) * p.speed * 60 * dt;
        p.y += Math.sin(p.angle) * p.speed * 60 * dt;
        p.life -= dt;
        if (p.owner === 'player') {
          for (let eIdx = game.enemies.length - 1; eIdx >= 0; eIdx--) {
            const e = game.enemies[eIdx];
            if (Math.hypot(e.x - p.x, e.y - p.y) <= e.r + p.radius) {
              damageEnemy(e, p.damage, p.x, p.y);
              game.projectiles.splice(i, 1);
              break;
            }
          }
        } else {
          if (Math.hypot(game.player.x - p.x, game.player.y - p.y) <= game.player.r + p.radius) {
            game.player.hp -= p.damage;
            game.player.invuln = 0.4;
            impactText(game.player.x, game.player.y, `-${p.damage}`, '#ff7d7d');
            if (game.player.hp <= 0) game.over = true;
            game.projectiles.splice(i, 1);
          }
        }

        if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
          game.projectiles.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        if (game.timeStopActive) {
          p.life -= dt * 0.1;
        } else {
          p.x += p.vx * 60 * dt;
          p.y += p.vy * 60 * dt;
          p.life -= dt;
        }
        if (p.life <= 0) game.particles.splice(i, 1);
      }
    }

    function updateWave(dt) {
      if (game.over) return;
      if (game.enemies.length === 0 && game.mode === 'game') {
        game.nextWaveDelay -= dt;
        if (game.nextWaveDelay <= 0) {
          game.wave += 1;
          game.nextWaveDelay = 1.5;
          spawnWave();
        }
      }
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#0d1b2d');
      grad.addColorStop(1, '#071b20');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y <= H; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      if (game.timeStopActive) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawPlayer() {
      if (!game.player) return;
      const p = game.player;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.direction || 0);

      if (p.standOn) {
        ctx.shadowColor = standDefs[p.standName].accent;
        ctx.shadowBlur = 16;
      }

      ctx.fillStyle = p.standOn ? standDefs[p.standName].color : '#f7f6ff';
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#171a2a';
      ctx.beginPath();
      ctx.arc(5, -2, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#9afac7';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(p.r + 18, 0);
      ctx.stroke();

      ctx.restore();

      const hpRatio = clamp(p.hp / p.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(p.x - 22, p.y - 30, 44, 6);
      ctx.fillStyle = '#8ef0b5';
      ctx.fillRect(p.x - 22, p.y - 30, 44 * hpRatio, 6);
    }

    function drawStandAura() {
      if (!game.player || !game.player.standOn) return;
      const p = game.player;
      const color = standDefs[p.standName].color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 38 + Math.sin(performance.now() * 0.02) * 6, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawEnemies() {
      game.enemies.forEach(enemy => {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.fillStyle = enemy.hitFlash > 0 ? '#fff7a0' : enemy.color;
        ctx.shadowColor = enemy.color;
        ctx.shadowBlur = enemy.type === 'boss' ? 18 : 8;
        ctx.beginPath();
        ctx.arc(0, 0, enemy.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(-enemy.r, -enemy.r - 12, enemy.r * 2, 6);
        ctx.fillStyle = '#69f09a';
        ctx.fillRect(-enemy.r, -enemy.r - 12, (enemy.hp / enemy.maxHp) * enemy.r * 2, 6);
        ctx.restore();
      });
    }

    function drawProjectiles() {
      game.projectiles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });
    }

    function drawParticles() {
      game.particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = clamp(p.life / (p.maxLife || 1), 0, 1);
        if (p.kind === 'text') {
          ctx.fillStyle = p.color;
          ctx.font = '700 15px Arial';
          ctx.fillText(p.text, p.x, p.y);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function drawGameOver() {
      if (!game.over) return;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 38px Arial';
      ctx.fillText('Battle Lost', W / 2, H / 2 - 10);
      ctx.font = '18px Arial';
      ctx.fillText('Press R to retry or choose another stand', W / 2, H / 2 + 28);
      ctx.textAlign = 'left';
    }

    function tick() {
      const now = performance.now();
      const dt = Math.min((now - (game.lastTs || now)) / 1000, 0.033);
      game.lastTs = now;

      if (game.mode === 'game' && !game.over && game.player) {
        updatePlayer(dt);
        updateWave(dt);
        updateProjectiles(dt);
        updateEnemies(dt);
        updateParticles(dt);
        updateHud();
      }

      drawBackground();
      drawProjectiles();
      drawEnemies();
      drawStandAura();
      drawPlayer();
      drawParticles();
      drawGameOver();
      requestAnimationFrame(tick);
    }

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      if (game.selectedStand) startGame();
    });

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (k === ' ') keys['space'] = true;
      if (game.bindMode) {
        const stand = standDefs[game.player.standName];
        const ability = stand.abilities.find(a => a.id === game.bindMode);
        if (ability) {
          ability.key = e.key.toUpperCase();
          game.bindMode = null;
          renderAbilityList();
        }
        e.preventDefault();
        return;
      }

      if (game.mode === 'game' && game.player) {
        if (k === 'q') toggleStand();
        if (k === 'r' && game.over) resetGame();

        const match = getStandAbilityByKey(e.key);
        if (match && game.player.standOn) {
          castAbility(match);
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = false;
      if (k === ' ') keys['space'] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * W;
      mouse.y = ((e.clientY - rect.top) / rect.height) * H;
      if (game.player) {
        const dx = mouse.x - game.player.x;
        const dy = mouse.y - game.player.y;
        game.player.direction = Math.atan2(dy, dx);
      }
    });

    canvas.addEventListener('mousedown', () => {
      if (game.mode === 'game') performM1();
    });

    initStandSelection();
    renderAbilityList();
    activateMenu();
    tick();
  </script>
</body>
